<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Solar System Order</title>
<meta name="description" content="Put the planets in order around the Sun, then give every planet its moons."/>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="stylesheet" href="./fonts.css"/>
<link rel="stylesheet" href="./styles.css"/>
<meta name="theme-color" content="#0a0e28"/>
<link rel="icon" href="./assets/icons/icon-192.png"/>
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Solar System"/>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>

<div id="app">

  <header id="bar">
    <nav id="levels" aria-label="Levels">
      <button class="lvl" data-level="1" type="button"><span>1</span></button>
      <button class="lvl" data-level="2" type="button"><span>2</span></button>
      <button class="lvl" data-level="3" type="button"><span>3</span></button>
    </nav>
    <h1 id="title">Put the planets in order</h1>
    <div id="tools">
      <button id="sound" class="tool" type="button" aria-pressed="true" aria-label="Sound on" aria-describedby="voiceNote">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h3l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7"/><path class="wave" d="M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="mute" d="M16 9.5l5 5m0-5l-5 5"/></svg>
      </button>
      <button id="again" class="tool" type="button" aria-label="Start this level again">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.6-5.4"/><path d="M19 4.5V9h-4.5"/></svg>
      </button>
    </div>
  </header>

  <main id="stage">
    <svg id="orbits" aria-hidden="true"></svg>
    <!-- All four Sun frames live in the DOM and cross-fade by class. Swapping one
         img's src re-requested the file on every tick. -->
    <div id="sun" aria-hidden="true">
      <img class="on" src="./assets/planets/sun-1.webp" alt=""/>
      <img src="./assets/planets/sun-2.webp" alt=""/>
      <img src="./assets/planets/sun-3.webp" alt=""/>
      <img src="./assets/planets/sun-4.webp" alt=""/>
    </div>
    <div id="slots"></div>
    <div id="placed"></div>
    <div id="sparks" aria-hidden="true"></div>
  </main>

  <p id="caption" aria-live="polite"></p>

  <!-- The AI-voice disclosure, hung off the sound button as its description. Every
       app that ships a voice we rendered carries its own line (AUDIO-DIRECTION.md,
       "One thing we should do regardless") -- this game is reachable by its own URL
       and most players never see the hub footer. There is no menu or home screen to
       print it on: the layout is header, stage, caption and tray, all sized to the
       viewport. The sound button is the one control the line actually belongs to.
       Unqualified here on purpose -- this game never falls back to speechSynthesis,
       so every voice in it really is one we rendered. -->
  <p id="voiceNote" class="sr-only">Every voice here is AI-generated. None is a recording of a real person.</p>

  <footer id="tray">
    <div id="trayRow"></div>
  </footer>

</div>

<div id="curtain" hidden>
  <div id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <div id="cardArt" aria-hidden="true"></div>
    <h2 id="cardTitle"></h2>
    <p id="cardText"></p>
    <button id="cardGo" class="big" type="button"></button>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
